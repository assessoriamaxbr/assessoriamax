<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Diagnóstico · AssessoriaMax</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#060606;font-family:'Outfit',sans-serif;}
#app{min-height:100vh;display:flex;flex-direction:column;background:#060606;max-width:680px;margin:0 auto;position:relative;}

/* TOP STATS */
.stats-bar{padding:22px 32px 18px;border-bottom:1px solid #1c1c1c;display:flex;align-items:stretch;gap:0;}
.stat-block{flex:1;text-align:center;padding:0 16px;position:relative;}
.stat-block+.stat-block::before{content:'';position:absolute;left:0;top:10%;height:80%;width:1px;background:#2a2a2a;}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:#C9A84C;letter-spacing:1px;line-height:1.1;}
.stat-label{font-size:9px;font-weight:500;color:#555;letter-spacing:2px;text-transform:uppercase;margin-top:4px;}

/* PROFILE ROW */
.profile-row{padding:16px 32px;border-bottom:1px solid #1c1c1c;display:flex;align-items:center;justify-content:space-between;}
.profile-left{display:flex;align-items:center;gap:12px;}
.avatar-wrap{position:relative;width:48px;height:48px;}
.avatar-wrap img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #C9A84C44;}
.avatar-dot{position:absolute;bottom:2px;right:2px;width:10px;height:10px;background:#22c55e;border-radius:50%;border:2px solid #060606;}
.profile-info .name{font-size:15px;font-weight:600;color:#ececec;letter-spacing:0.2px;}
.profile-info .role{font-size:12px;color:#666;margin-top:1px;}
.profile-info .role strong{color:#C9A84C;font-weight:600;}
.profile-info .role .online{color:#22c55e;font-weight:500;}
.progress-mini{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.progress-mini-track{width:120px;height:3px;background:#1a1a1a;border-radius:3px;overflow:hidden;}
.progress-mini-fill{height:100%;background:linear-gradient(90deg,#8B6914,#C9A84C);border-radius:3px;transition:width 0.5s ease;width:0%;}
.progress-mini-label{font-size:10px;color:#444;letter-spacing:1px;}

/* BANNER */
.diag-banner{margin:16px 32px;background:linear-gradient(135deg,#C9A84C,#A8832A);border-radius:10px;padding:14px 20px;text-align:center;}
.diag-banner .banner-title{font-size:11px;font-weight:600;color:#1a0e00;letter-spacing:2.5px;text-transform:uppercase;}
.diag-banner .banner-sub{font-size:13px;font-weight:700;color:#1a0e00;letter-spacing:1px;margin-top:2px;}
.diag-banner .banner-sub span{opacity:0.65;font-weight:400;}

/* CHAT */
.chat-area{flex:1;padding:20px 32px 8px;display:flex;flex-direction:column;gap:14px;min-height:300px;}

.msg-row{display:flex;align-items:flex-end;gap:10px;opacity:0;transform:translateY(10px);transition:opacity 0.4s ease,transform 0.4s ease;}
.msg-row.visible{opacity:1;transform:translateY(0);}
.msg-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1.5px solid #C9A84C33;}
.bubble{background:#101010;border:1px solid #1e1e1e;border-radius:16px 16px 16px 4px;padding:11px 15px;max-width:80%;}
.bubble p{font-size:14px;line-height:1.65;color:#ddd;}
.bubble strong{color:#C9A84C;font-weight:600;}

.typing-bubble{background:#101010;border:1px solid #1e1e1e;border-radius:16px 16px 16px 4px;padding:13px 16px;display:flex;gap:5px;align-items:center;}
.dot{width:6px;height:6px;border-radius:50%;background:#C9A84C;animation:bounce 1.2s infinite;}
.dot:nth-child(2){animation-delay:.2s;}
.dot:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.35;}30%{transform:translateY(-5px);opacity:1;}}

.user-bubble{display:flex;justify-content:flex-end;opacity:0;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease;}
.user-bubble.visible{opacity:1;transform:translateY(0);}
.user-msg{background:linear-gradient(135deg,#C9A84C18,#8B691408);border:1px solid #C9A84C2a;border-radius:16px 16px 4px 16px;padding:10px 15px;max-width:72%;}
.user-msg p{font-size:14px;color:#e0e0e0;}

/* OPTIONS */
.options-grid{display:flex;flex-wrap:wrap;gap:8px;padding:4px 32px 10px;}
.opt-btn{background:#0c0c0c;border:1px solid #252525;border-radius:50px;padding:9px 18px;font-size:13px;color:#bbb;font-family:'Outfit',sans-serif;cursor:pointer;transition:all .25s;}
.opt-btn:hover{border-color:#C9A84C;color:#C9A84C;background:#C9A84C0d;}

/* INPUT */
.input-area{padding:10px 32px 24px;}
.input-row{display:flex;gap:10px;align-items:center;}
.text-input{flex:1;background:#0c0c0c;border:1px solid #1e1e1e;border-radius:50px;padding:13px 20px;font-size:14px;color:#e0e0e0;font-family:'Outfit',sans-serif;outline:none;transition:border-color .3s;}
.text-input::placeholder{color:#3a3a3a;}
.text-input:focus{border-color:#C9A84C44;}
.send-btn{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#C9A84C,#8B6914);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .2s,opacity .2s;}
.send-btn:hover{transform:scale(1.06);}
.send-btn:active{transform:scale(0.94);}
.send-btn:disabled{opacity:.35;cursor:default;}
.send-btn svg{width:18px;height:18px;fill:#080808;}

/* FINAL */
.final-card{background:linear-gradient(135deg,#0f0f0f 60%,#1a1200);border:1px solid #C9A84C2a;border-radius:16px;padding:24px;text-align:center;margin:0 32px 8px;}
.final-card h3{font-family:'Cormorant Garamond',serif;font-size:22px;color:#C9A84C;font-weight:700;margin-bottom:8px;}
.final-card p{font-size:13px;color:#777;line-height:1.7;margin-bottom:18px;}
.wpp-btn{display:inline-flex;align-items:center;gap:9px;background:#25D366;color:#fff;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;padding:13px 26px;border-radius:50px;border:none;cursor:pointer;transition:transform .2s,box-shadow .2s;text-decoration:none;}
.wpp-btn:hover{transform:scale(1.03);box-shadow:0 4px 20px #25D36644;}
</style>
</head>

document.getElementById('profile-photo').src = 'data:image/png;base64,' + PHOTO_B64;

const MSG_AVATAR = 'data:image/png;base64,' + PHOTO_B64;

const questions = [
  {type:'text', msg:'Pra começar, qual é o seu <strong>nome completo</strong>?', placeholder:'Ex: Dr. Rafael Souza'},
  {type:'options', msg:(n)=>`Prazer, <strong>${n}</strong>! Você já investe em <strong>tráfego pago</strong> hoje?`, opts:['Sim, já invisto','Não, ainda não','Já investi, parei']},
  {type:'options', msg:'Qual é a sua maior <strong>dificuldade</strong> hoje no comercial?', opts:['Gerar novos clientes','Converter leads em clientes','Escalar o faturamento','Organizar o processo']},
  {type:'text', msg:'Qual é o seu <strong>faturamento mensal médio</strong> hoje?', placeholder:'Ex: R$ 15.000 / mês'}
];

let step=0, userName='';
const chat=document.getElementById('chat-area');
const inp=document.getElementById('main-input');
const sendBtn=document.getElementById('send-btn');
const progFill=document.getElementById('prog-fill');
const progLabel=document.getElementById('prog-label');
const optsContainer=document.getElementById('opts-container');

function addMsg(html,delay=0){
  return new Promise(res=>{
    setTimeout(()=>{
      const row=document.createElement('div');
      row.className='msg-row';
      row.innerHTML=`<img class="msg-avatar" src="${MSG_AVATAR}" alt="Matheus"/><div class="bubble"><p>${html}</p></div>`;
      chat.appendChild(row);
      chat.scrollTop=chat.scrollHeight;
      requestAnimationFrame(()=>setTimeout(()=>{row.classList.add('visible');res();},30));
    },delay);
  });
}

function addUserMsg(text){
  return new Promise(res=>{
    const row=document.createElement('div');
    row.className='user-bubble';
    row.innerHTML=`<div class="user-msg"><p>${text}</p></div>`;
    chat.appendChild(row);
    chat.scrollTop=chat.scrollHeight;
    requestAnimationFrame(()=>setTimeout(()=>{row.classList.add('visible');res();},30));
  });
}

function showTyping(){
  return new Promise(res=>{
    const row=document.createElement('div');
    row.className='msg-row visible';row.id='typing-row';
    row.innerHTML=`<img class="msg-avatar" src="${MSG_AVATAR}" alt="Matheus"/><div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    chat.appendChild(row);chat.scrollTop=chat.scrollHeight;
    setTimeout(res,850);
  });
}
function removeTyping(){const t=document.getElementById('typing-row');if(t)t.remove();}

function updateProgress(){
  const pct=Math.round((step/questions.length)*100);
  progFill.style.width=pct+'%';
  progLabel.textContent=step+'/'+questions.length;
}

function showOptions(opts){
  optsContainer.innerHTML='';
  optsContainer.style.display='flex';
  opts.forEach(o=>{
    const btn=document.createElement('button');
    btn.className='opt-btn';btn.textContent=o;
    btn.onclick=()=>{
      document.getElementById('input-area').style.display='flex';
      processAnswer(o);
    };
    optsContainer.appendChild(btn);
  });
}
function clearOptions(){optsContainer.innerHTML='';optsContainer.style.display='none';}

async function showQuestion(){
  if(step>=questions.length){showFinal();return;}
  const q=questions[step];
  clearOptions();inp.value='';
  updateProgress();
  const msgText=typeof q.msg==='function'?q.msg(userName):q.msg;
  await showTyping();removeTyping();
  await addMsg(msgText);
  if(q.type==='options'){
    document.getElementById('input-area').style.display='none';
    showOptions(q.opts);
  } else {
    document.getElementById('input-area').style.display='flex';
    inp.placeholder=q.placeholder;inp.focus();
  }
}

async function processAnswer(val){
  if(!val.trim())return;
  clearOptions();sendBtn.disabled=true;inp.disabled=true;
  if(step===0)userName=val.trim().split(' ')[0];
  await addUserMsg(val.trim());
  inp.value='';step++;updateProgress();
  await new Promise(r=>setTimeout(r,400));
  if(step<questions.length){await showQuestion();}
  else{await showTyping();removeTyping();await showFinal();}
  sendBtn.disabled=false;inp.disabled=false;
}

function handleSend(){const v=inp.value.trim();if(v)processAnswer(v);}
inp.addEventListener('keydown',e=>{if(e.key==='Enter')handleSend();});
