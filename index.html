<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Diagnóstico Comercial · AssessoriaMax</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0a;
  --card:#111111;
  --card2:#181818;
  --border:#2a2a2a;
  --gold:#d4a843;
  --gold2:#f0c85a;
  --gold3:#a07828;
  --gold-dim:rgba(212,168,67,0.15);
  --gold-border:rgba(212,168,67,0.35);
  --text:#ffffff;
  --muted:#888888;
  --muted2:#444444;
  --green:#e8b84b;
  --green-dim:rgba(212,168,67,0.12);
  --input-bg:#1a1a1a;
}
html,body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh}
body{display:flex;flex-direction:column;align-items:center;padding:0}

.wrap{width:100%;max-width:560px;padding:0 0 80px;display:flex;flex-direction:column}

/* STATS */
.stats-bar{display:flex;justify-content:center;padding:12px 0 10px;border-bottom:1px solid var(--border)}
.stat{text-align:center;flex:1;position:relative}
.stat+.stat::before{content:'';position:absolute;left:0;top:15%;height:70%;width:1px;background:var(--border)}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--gold2);line-height:1;display:block}
.stat-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-top:3px;display:block}

/* FIXED HEADER — profile + badge + progress */
.fixed-header{
  position:fixed;top:0;left:0;right:0;z-index:999;
  background:var(--bg);
  max-width:560px;margin:0 auto;width:100%;
  border-bottom:1px solid var(--border);
  padding-bottom:10px;
}

/* PROFILE */
.profile-row{display:flex;align-items:center;gap:14px;padding:14px 20px 0}
.avatar{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.profile-name{font-weight:700;font-size:14px;color:var(--text)}
.profile-sub{font-size:11px;color:var(--gold);margin-top:2px;display:flex;align-items:center;gap:5px}
.online-dot{width:7px;height:7px;border-radius:50%;background:#4cdf6a;flex-shrink:0}

/* BADGE BOX */
.badge-box{margin:10px 20px 0;background:var(--gold);border-radius:8px;padding:9px 14px;text-align:center}
.badge-box p{font-size:10.5px;font-weight:700;color:#000;text-transform:uppercase;letter-spacing:0.5px;line-height:1.45}

/* PROGRESS */
.progress-row{display:flex;align-items:center;gap:10px;padding:10px 20px 0}
.progress-track{flex:1;height:3px;background:var(--border);border-radius:3px}
.progress-fill{height:100%;border-radius:3px;background:var(--gold2);transition:width .45s ease}
.progress-label{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* CHAT AREA */
.chat-area{padding:18px 20px 0;display:flex;flex-direction:column;gap:12px}

/* BOT MESSAGE */
.msg-bot{display:flex;gap:10px;align-items:flex-end}
.msg-avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0}
.msg-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.bubble{background:var(--card2);border:1px solid var(--border);border-radius:14px 14px 14px 2px;padding:12px 15px;font-size:14px;line-height:1.6;max-width:88%;color:var(--text)}
.bubble .hl{color:var(--gold);font-weight:700}
.bubble .hl-g{color:var(--gold2);font-weight:700}

/* USER (LEAD) REPLY — right side WhatsApp style */
.msg-user{display:flex;justify-content:flex-end;padding-left:40px}
.bubble-user{background:var(--gold-dim);border:1.5px solid var(--gold-border);border-radius:14px 14px 2px 14px;padding:11px 15px;font-size:14px;line-height:1.6;max-width:88%;color:var(--gold2);font-weight:500}

/* INPUT AREA */
.input-area{padding:14px 20px 0}
.input-wrap{position:relative}
.input-wrap input,.input-wrap textarea{
  width:100%;background:var(--input-bg);border:1.5px solid var(--border);
  border-radius:10px;padding:13px 16px;font-size:14px;color:var(--text);
  font-family:'Barlow',sans-serif;outline:none;transition:border .2s;resize:none
}
.input-wrap input::placeholder,.input-wrap textarea::placeholder{color:var(--muted2)}
.input-wrap input:focus,.input-wrap textarea:focus{border-color:var(--gold)}

/* OPTIONS */
.options-list{display:flex;flex-direction:column;gap:8px;padding:14px 20px 0}
.opt-btn{
  background:var(--card2);border:1.5px solid var(--border);border-radius:10px;
  padding:13px 16px;text-align:left;cursor:pointer;font-size:14px;color:var(--text);
  font-family:'Barlow',sans-serif;transition:border .15s,background .15s;width:100%;line-height:1.4
}
.opt-btn:hover{border-color:var(--gold);background:var(--gold-dim);color:var(--gold2)}
.opt-btn .num{color:var(--gold);font-weight:700;margin-right:8px}

/* SEND BUTTON */
.send-btn{
  display:block;width:calc(100% - 40px);margin:14px 20px 0;padding:15px;
  background:var(--gold);border:none;border-radius:12px;font-size:15px;font-weight:700;
  color:#000;font-family:'Barlow',sans-serif;cursor:pointer;letter-spacing:0.5px;transition:opacity .15s
}
.send-btn:hover{opacity:.88}
.send-btn:disabled{opacity:.35;cursor:not-allowed}

/* RAIO-X CARD */
.raio-card{margin:14px 20px 0;background:var(--card2);border:1.5px solid var(--border);border-radius:14px;padding:18px}
.raio-title{font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1.8px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.raio-title::after{content:'';flex:1;height:1px;background:var(--border)}
.raio-section{margin-bottom:14px}
.raio-section-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px}
.raio-item{display:flex;gap:8px;align-items:flex-start;margin-bottom:7px;font-size:13px;line-height:1.5}
.raio-item .dot-r{color:#ff4444;font-size:14px;flex-shrink:0;margin-top:2px}
.raio-item .dot-g{color:var(--gold2);font-size:14px;flex-shrink:0;margin-top:2px}
.raio-profile{display:flex;gap:12px;align-items:center;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.raio-av{width:40px;height:40px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;color:#000;font-size:15px;flex-shrink:0}
.raio-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.raio-info-name{font-weight:700;font-size:14px;color:var(--text)}
.raio-info-sub{font-size:12px;color:var(--muted);margin-top:2px}
.raio-insight{background:var(--gold-dim);border:1px solid var(--gold-border);border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.6;color:var(--text)}

/* CTA BUTTON */
.cta-btn{
  display:block;width:calc(100% - 40px);margin:16px 20px 0;padding:18px;
  background:var(--gold);border:none;border-radius:12px;font-size:15px;font-weight:700;
  color:#000;font-family:'Barlow',sans-serif;cursor:pointer;letter-spacing:0.8px;
  transition:opacity .15s;text-align:center;text-transform:uppercase
}
.cta-btn:hover{opacity:.88}

/* CONFIRM CARD */
.confirm-card{margin:14px 20px 0;background:var(--card2);border:1.5px solid var(--gold-border);border-radius:14px;padding:26px;text-align:center}
.confirm-check{width:54px;height:54px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:22px;color:#000;font-weight:900}
.confirm-title{font-size:18px;font-weight:700;margin-bottom:8px;line-height:1.3}
.confirm-sub{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:20px}
.confirm-steps{display:flex;flex-direction:column;gap:8px;text-align:left}
.confirm-step{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 15px}
.step-num{width:26px;height:26px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#000;flex-shrink:0;margin-top:1px}
.step-text{font-size:13px;line-height:1.55}
.step-text strong{color:var(--text);font-weight:700}
.step-text span{color:var(--muted)}
.timer-row{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:18px;font-size:12px;color:var(--muted)}

/* FOOTER */
.footer{padding:32px 20px 24px;display:flex;align-items:center;justify-content:center;gap:7px}
.footer svg{flex-shrink:0}
.footer span{font-size:12px;color:var(--muted);line-height:1.4;text-align:center}

/* ANIMATIONS */
.fade-in{animation:fadeIn .35s ease forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.typing{display:flex;gap:4px;align-items:center;padding:4px 0}
.dot-t{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.dot-t:nth-child(2){animation-delay:.2s}.dot-t:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.2}30%{opacity:1}}
</style>

// Gera ou recupera ID único da sessão
function getLeadId() {
  let id = sessionStorage.getItem('lead_id');
  if (!id) {
    const ts  = Date.now();
    const rnd = Math.random().toString(36).substring(2, 7);
    id = 'lead_' + ts + '_' + rnd;
    sessionStorage.setItem('lead_id', id);
  }
  return id;

function getFBData() {
  const cookies = document.cookie.split(';').reduce((acc, c) => {
    const [k, v] = c.trim().split('=');
    acc[k] = v;
    return acc;
  }, {});
  const fbp = cookies['_fbp'] || '';
  const fbc = cookies['_fbc'] || (() => {
    // Se não tem _fbc no cookie mas tem fbclid na URL, monta manualmente
    const fbclid = new URLSearchParams(window.location.search).get('fbclid') || '';
    return fbclid ? 'fb.1.' + Date.now() + '.' + fbclid : '';
  })();
  return { fbp, fbc };
}

// ── FILA SEQUENCIAL ─────────────────────────────────────────
// Garante que cada campo é enviado SÓ após o anterior confirmar,
// eliminando a criação de linhas duplicadas no Apps Script.
const _queue   = [];
let   _sending = false;

function _processQueue() {
  if (_sending || _queue.length === 0) return;
  _sending = true;
  const { field, value, resolve } = _queue.shift();
  const id     = getLeadId();
  const params = new URLSearchParams({ action:'save', id, field, value });
  const s      = document.createElement('script');
  s.src        = SHEET_URL + '?' + params.toString() + '&t=' + Date.now();
  s.onload = () => { s.remove(); _sending=false; if(resolve) resolve(); _processQueue(); };
  s.onerror= () => { s.remove(); _sending=false; if(resolve) resolve(); _processQueue(); };
  document.head.appendChild(s);
}

// Envia um campo para a planilha — aguarda vez na fila
function sendToSheet(field, value) {
  return new Promise(resolve => {
    _queue.push({ field, value, resolve });
    _processQueue();
  });
}

// Salva FBP, FBC e UA — adicionados à fila depois dos dados principais
function sendFBData() {
  const ua = navigator.userAgent;
  sendToSheet('ua', ua);

  function tryCapture(attempt) {
    const { fbp, fbc } = getFBData();
    if (fbp) sendToSheet('fbp', fbp);
    if (fbc) sendToSheet('fbc', fbc);
    if (!fbp && attempt < 3) {
      setTimeout(() => tryCapture(attempt + 1), attempt === 1 ? 2000 : 5000);
    }
  }
  // Aguarda 1s para o Pixel inicializar antes de capturar cookies
  setTimeout(() => tryCapture(1), 1000);
}

function scrollBottom(){
  const chat = document.getElementById('chatArea');
  const inputArea = document.getElementById('inputArea');
  const lastChat  = chat && chat.lastElementChild;
  const lastInput = inputArea && inputArea.lastElementChild;
  const target = lastInput || lastChat;
  if(!target) return;

  const rect = target.getBoundingClientRect();
  const windowH = window.innerHeight;

  // Só rola se o elemento estiver ABAIXO da área visível
  // Se estiver acima ou visível, não faz nada — a mensagem fica onde está
  if(rect.bottom > windowH){
    target.scrollIntoView({behavior:'smooth', block:'end'});
  }
}

}
