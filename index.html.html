<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Diagnóstico Comercial · AssessoriaMax</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ... (Seu CSS permanece exatamente o mesmo) ... */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0a;
  --card:#111111;
  --card2:#181818;
  --border:#2a2a2a;
  --gold:#d4a843;
  --gold2:#f0c85a;
  --gold3:#a07828;
  --gold-dim:rgba(212,168,67,0.15);
  --gold-border:rgba(212,168,67,0.35);
  --text:#ffffff;
  --muted:#888888;
  --muted2:#444444;
  --green:#e8b84b;
  --green-dim:rgba(212,168,67,0.12);
  --input-bg:#1a1a1a;
}
html,body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh}
body{display:flex;flex-direction:column;align-items:center;padding:0}
.wrap{width:100%;max-width:560px;padding:0 0 80px;display:flex;flex-direction:column}
.stats-bar{display:flex;justify-content:center;padding:16px 0 14px;border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:999;background:var(--bg);max-width:560px;margin:0 auto;width:100%}
.stat{text-align:center;flex:1;position:relative}
.stat+.stat::before{content:'';position:absolute;left:0;top:15%;height:70%;width:1px;background:var(--border)}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:2px;color:var(--gold2);line-height:1;display:block}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-top:4px;display:block}
.profile-row{display:flex;align-items:center;gap:14px;padding:20px 20px 0}
.avatar{width:48px;height:48px;border-radius:50%;border:2px solid var(--gold);overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.profile-name{font-weight:700;font-size:15px;color:var(--text)}
.profile-sub{font-size:12px;color:var(--gold);margin-top:2px;display:flex;align-items:center;gap:5px}
.online-dot{width:7px;height:7px;border-radius:50%;background:#4cdf6a;flex-shrink:0}
.badge-box{margin:16px 20px 0;background:var(--gold);border-radius:10px;padding:13px 16px;text-align:center}
.badge-box p{font-size:12px;font-weight:700;color:#000;text-transform:uppercase;letter-spacing:0.6px;line-height:1.5}
.progress-row{display:flex;align-items:center;gap:10px;padding:18px 20px 0}
.progress-track{flex:1;height:3px;background:var(--border);border-radius:3px}
.progress-fill{height:100%;border-radius:3px;background:var(--gold2);transition:width .45s ease}
.progress-label{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chat-area{padding:18px 20px 0;display:flex;flex-direction:column;gap:12px}
.msg-bot{display:flex;gap:10px;align-items:flex-end}
.msg-avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0}
.msg-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.bubble{background:var(--card2);border:1px solid var(--border);border-radius:14px 14px 14px 2px;padding:12px 15px;font-size:14px;line-height:1.6;max-width:88%;color:var(--text)}
.bubble .hl{color:var(--gold);font-weight:700}
.bubble .hl-g{color:var(--gold2);font-weight:700}
.msg-user{display:flex;justify-content:flex-end;padding-left:40px}
.bubble-user{background:var(--gold-dim);border:1.5px solid var(--gold-border);border-radius:14px 14px 2px 14px;padding:11px 15px;font-size:14px;line-height:1.6;max-width:88%;color:var(--gold2);font-weight:500}
.input-area{padding:14px 20px 0}
.input-wrap{position:relative}
.input-wrap input,.input-wrap textarea{
  width:100%;background:var(--input-bg);border:1.5px solid var(--border);
  border-radius:10px;padding:13px 16px;font-size:14px;color:var(--text);
  font-family:'Barlow',sans-serif;outline:none;transition:border .2s;resize:none
}
.input-wrap input::placeholder,.input-wrap textarea::placeholder{color:var(--muted2)}
.input-wrap input:focus,.input-wrap textarea:focus{border-color:var(--gold)}
.options-list{display:flex;flex-direction:column;gap:8px;padding:14px 20px 0}
.opt-btn{
  background:var(--card2);border:1.5px solid var(--border);border-radius:10px;
  padding:13px 16px;text-align:left;cursor:pointer;font-size:14px;color:var(--text);
  font-family:'Barlow',sans-serif;transition:border .15s,background .15s;width:100%;line-height:1.4
}
.opt-btn:hover{border-color:var(--gold);background:var(--gold-dim);color:var(--gold2)}
.opt-btn .num{color:var(--gold);font-weight:700;margin-right:8px}
.send-btn{
  display:block;width:calc(100% - 40px);margin:14px 20px 0;padding:15px;
  background:var(--gold);border:none;border-radius:12px;font-size:15px;font-weight:700;
  color:#000;font-family:'Barlow',sans-serif;cursor:pointer;letter-spacing:0.5px;transition:opacity .15s
}
.send-btn:hover{opacity:.88}
.send-btn:disabled{opacity:.35;cursor:not-allowed}
.footer{padding:32px 20px 24px;display:flex;align-items:center;justify-content:center;gap:7px}
.footer span{font-size:12px;color:var(--muted);line-height:1.4;text-align:center}
.fade-in{animation:fadeIn .35s ease forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="wrap" id="app" style="padding-top:70px">
  <!-- STATS -->
  <div class="stats-bar">
    <div class="stat"><span class="stat-num">+R$10M</span><span class="stat-label">Em receita gerada</span></div>
    <div class="stat"><span class="stat-num">+250</span><span class="stat-label">Clientes ativos</span></div>
    <div class="stat"><span class="stat-num">+6 anos</span><span class="stat-label">No mercado</span></div>
  </div>

  <!-- PROFILE -->
  <div class="profile-row">
    <div class="avatar"><img src="https://via.placeholder.com/150" alt="Avatar"/></div>
    <div>
      <div class="profile-name">Matheus Oliveira</div>
      <div class="profile-sub"><span class="online-dot"></span><span><span style="color:#4cdf6a;font-weight:600">online agora</span> · Proprietário AssessoriaMax</span></div>
    </div>
  </div>

  <div class="badge-box">
    <p>Diagnóstico Especialista em Comercial e Demanda para<br>Advogado Previdencialista</p>
  </div>

  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="progBar" style="width:0%"></div></div>
    <div class="progress-label" id="progLabel">0 / 10</div>
  </div>

  <div class="chat-area" id="chatArea"></div>
  <div id="inputArea"></div>

  <div class="footer">
    <span>Seus dados são confidenciais · não compartilhamos com terceiros</span>
  </div>
</div>

<script>
// --- VARIÁVEIS DO SEU SCRIPT ---
let step = 0;
const total = 10;
const chat = document.getElementById('chatArea');
const inputArea = document.getElementById('inputArea');
let leadId = localStorage.getItem("leadId"); // MODIFICAÇÃO: Recupera o ID salvo

// --- MODIFICAÇÃO: FUNÇÃO DE SALVAMENTO ---
async function salvarLead(nomeDoLead) {
  const URL_WEBHOOK = "SUA_URL_AQUI"; // <--- COLOQUE SUA URL AQUI

  try {
    if (leadId) {
      // Atualiza lead existente
      await fetch(URL_WEBHOOK, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "update", id: leadId, nome: nomeDoLead })
      });
    } else {
      // Cria novo lead
      const response = await fetch(URL_WEBHOOK, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "create", nome: nomeDoLead })
      });
      const result = await response.json();
      if (result.id) {
        leadId = result.id;
        localStorage.setItem("leadId", leadId);
      }
    }
  } catch (e) {
    console.error("Erro ao salvar lead:", e);
  }
}

// --- LÓGICA DE TRANSIÇÃO (SIMULADA COM BASE NO SEU PADRÃO) ---
async function proximaEtapa() {
  const inputNome = document.getElementById("nome");
  
  if (step === 0 && inputNome) {
    const nomeVal = inputNome.value;
    if(nomeVal) {
        // MODIFICAÇÃO: Salva o nome antes de avançar
        await salvarLead(nomeVal);
    }
  }
  
  // Aqui segue sua lógica original de mudar o 'step' e renderizar a próxima pergunta
  step++;
  renderStep(); 
}

// Exemplo de como você deve montar seu input no renderStep()
function renderStep() {
    if(step === 0) {
        inputArea.innerHTML = `
            <div class="input-wrap">
                <input type="text" id="nome" placeholder="Digite seu nome completo...">
            </div>
            <button class="send-btn" onclick="proximaEtapa()">Continuar</button>
        `;
    } else {
        inputArea.innerHTML = `<p>Próxima pergunta (Step ${step})...</p>`;
    }
}

// Inicia
renderStep();

</script>
</body>
</html>
