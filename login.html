<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>AssessoriaMax · Login</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080808;--card:#111;--border:#1e1e1e;--border2:#2a2a2a;
  --gold:#d4a843;--gold2:#f0c85a;--gdim:rgba(212,168,67,.1);--gbrd:rgba(212,168,67,.25);
  --text:#f0f0f0;--muted:#666;--red:#e74c3c;
}
html,body{
  background:var(--bg);color:var(--text);
  font-family:'Barlow',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}

/* FUNDO COM BRILHO */
.bg-glow{
  position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 50% at 20% 50%, rgba(212,168,67,.06) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 80% 20%, rgba(212,168,67,.04) 0%, transparent 70%);
}

/* CARD */
.card{
  width:100%;max-width:380px;padding:40px 36px 36px;
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  position:relative;z-index:1;
  box-shadow:0 24px 64px rgba(0,0,0,.6);
  margin:16px;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  border-radius:16px 16px 0 0;
}

/* LOGO */
.logo-wrap{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:28px}
.logo-wrap img{width:42px;height:42px;object-fit:contain}
.logo-text .mark{
  font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;
  color:var(--gold);line-height:1;
}
.logo-text .sub{
  font-size:9px;color:var(--muted);letter-spacing:2px;
  text-transform:uppercase;margin-top:2px;
}

/* TÍTULO */
.login-title{
  font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;
  color:var(--text);text-align:center;margin-bottom:6px;
}
.login-sub{
  font-size:12px;color:var(--muted);text-align:center;margin-bottom:28px;
}

/* FORM */
.fg{margin-bottom:14px}
.fl{
  display:block;font-size:10px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px;
}
.fi{
  width:100%;background:#0d0d0d;border:1.5px solid var(--border2);
  border-radius:9px;padding:12px 14px;font-size:14px;color:var(--text);
  font-family:'Barlow',sans-serif;outline:none;transition:border .2s,box-shadow .2s;
}
.fi:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,168,67,.08)}
.fi::placeholder{color:#333}

/* PASSWORD TOGGLE */
.pass-wrap{position:relative}
.pass-wrap .fi{padding-right:42px}
.pass-eye{
  position:absolute;right:13px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:var(--muted);
  display:flex;align-items:center;padding:4px;transition:color .15s;
}
.pass-eye:hover{color:var(--gold)}

/* ERRO */
.error-msg{
  background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.3);
  border-radius:8px;padding:10px 14px;font-size:12px;color:var(--red);
  margin-bottom:14px;display:none;align-items:center;gap:8px;
}
.error-msg.show{display:flex}

/* BOTÃO */
.btn{
  width:100%;padding:14px;background:var(--gold);border:none;border-radius:10px;
  font-size:15px;font-weight:700;color:#000;font-family:'Barlow',sans-serif;
  cursor:pointer;letter-spacing:0.5px;transition:opacity .15s,transform .1s;
  margin-top:6px;position:relative;overflow:hidden;
}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.98)}
.btn.loading{opacity:.7;pointer-events:none}
.btn-spinner{
  display:none;position:absolute;inset:0;align-items:center;justify-content:center;
  background:var(--gold);
}
.btn.loading .btn-spinner{display:flex}
.spinner{
  width:18px;height:18px;border:2px solid rgba(0,0,0,.3);
  border-top-color:#000;border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* RODAPÉ */
.card-foot{
  margin-top:24px;padding-top:18px;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.card-foot svg{flex-shrink:0}
.card-foot span{font-size:11px;color:var(--muted)}
</style>
</head>

      <button class="pass-eye" id="eyeBtn" onclick="toggleEye()" tabindex="-1" type="button">
        <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

      <rect x="3" y="11" width="18" height="11" rx="2"/>

    </svg>

  </div>

<script>
// Credenciais em hash SHA-256
const VALID_USER = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918";
const VALID_PASS = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";
const REDIRECT   = "https://assessoriamax.vercel.app/dashboard.html";
const SESSION_KEY = "am_auth";

// Se já está logado, redireciona direto
if(sessionStorage.getItem(SESSION_KEY) === "true"){
  window.location.href = REDIRECT;
}

// SHA-256 via Web Crypto API
async function sha256(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function doLogin(){
  const user = document.getElementById("inputUser").value.trim();
  const pass = document.getElementById("inputPass").value;
  const err  = document.getElementById("errorMsg");
  const btn  = document.getElementById("loginBtn");

  if(!user || !pass){
    err.classList.add("show");
    return;
  }

  btn.classList.add("loading");
  err.classList.remove("show");

  const [uHash, pHash] = await Promise.all([sha256(user), sha256(pass)]);

  await new Promise(r => setTimeout(r, 600)); // delay natural

  if(uHash === VALID_USER && pHash === VALID_PASS){
    sessionStorage.setItem(SESSION_KEY, "true");
    // Animação de sucesso
    btn.style.background = "#27ae60";
    btn.querySelector(".btn-spinner").style.display = "none";
    btn.innerHTML = "✓ Acessando...";
    setTimeout(() => window.location.href = REDIRECT, 700);
  } else {
    btn.classList.remove("loading");
    err.classList.add("show");
    document.getElementById("inputPass").value = "";
    document.getElementById("inputPass").focus();
    // Shake no card
    const card = document.querySelector(".card");
    card.style.animation = "shake .3s ease";
    setTimeout(() => card.style.animation = "", 300);
  }
}

// Enter para logar
document.addEventListener("keydown", e => { if(e.key === "Enter") doLogin(); });

// Toggle mostrar senha
function toggleEye(){
  const input = document.getElementById("inputPass");
  const icon  = document.getElementById("eyeIcon");
  if(input.type === "password"){
    input.type = "text";
    icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;
  } else {
    input.type = "password";
    icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  }
}
</script>

<style>
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(5px)}
}
</style>
